## Error Handling

### Standard Error Response Format

```json
{
  "error": "Human-readable error message",
  "code": "ERROR_CODE"
}
```

### Error Codes

| Code | HTTP Status | Description |
|------|-------------|-------------|
| `UNAUTHORIZED` | 401 | User not authenticated |
| `INVALID_TOKEN` | 401 | Invalid or expired authentication token |
| `MISSING_PARAMS` | 400 | Required parameters missing |
| `INVALID_DURATION` | 400 | Video duration exceeds 60 seconds |
| `INVALID_FORMAT` | 400 | Unsupported video format |
REMOVED: YouTube feature
| `OAUTH_DENIED` | 403 | User denied OAuth consent |
| `OAUTH_FAILED` | 500 | OAuth flow failed |
| `CLOUDINARY_ERROR` | 500 | Cloudinary upload failed |
| `DATABASE_ERROR` | 500 | MongoDB operation failed |
| `NOT_FOUND` | 404 | Resource not found |

---

## Security Requirements

1. **Authentication**: All endpoints except `/auth/youtube/callback` require valid Clerk authentication
2. **Authorization**: Users can only access their own video uploads
REMOVED: YouTube feature
3. **Encryption**: YouTube credentials must be encrypted at rest
4. **HTTPS**: All production endpoints must use HTTPS
5. **CORS**: API routes should only accept requests from allowed origins

