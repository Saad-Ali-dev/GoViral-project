<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="nextjsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#434343;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pythonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3776AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD43B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="databaseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#47A248;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E6B2C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudinaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E84A5F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="youtubeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clerkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6C47FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B32C3;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#F9FAFB"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#111827">GoViral System Architecture</text>
  <text x="600" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#6B7280">Dual-Backend AI Platform for YouTube SEO Automation</text>
  
  <!-- User Section -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#111827">User Browser</text>
    <text x="90" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6B7280">React 19 + Tailwind v4</text>
    <!-- User icon -->
    <circle cx="40" cy="55" r="12" fill="#3B82F6" opacity="0.1"/>
    <path d="M40 50c2.5 0 4.5 2 4.5 4.5S42.5 59 40 59s-4.5-2-4.5-4.5S37.5 50 40 50zm0-6c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z" fill="#3B82F6"/>
  </g>
  
  <!-- Arrow to Next.js -->
  <line x1="230" y1="140" x2="320" y2="140" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="275" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280">HTTPS</text>
  
  <!-- Next.js Box (Primary Backend &amp; Frontend) -->
  <g transform="translate(330, 100)">
    <!-- Main container -->
    <rect x="0" y="0" width="540" height="320" rx="16" fill="url(#nextjsGradient)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="540" height="40" rx="16" fill="#000000"/>
    <rect x="0" y="20" width="540" height="20" fill="#000000"/>
    <text x="270" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Next.js 16 (Vercel)</text>
    <text x="270" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#9CA3AF">Primary Backend &amp; Frontend</text>
    
    <!-- React UI -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="150" height="70" rx="8" fill="#FFFFFF" opacity="0.95"/>
      <text x="75" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">React UI</text>
      <text x="75" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#6B7280">SSR/CSR + Server Components</text>
    </g>
    
    <!-- Clerk Auth -->
    <g transform="translate(190, 60)">
      <rect x="0" y="0" width="150" height="70" rx="8" fill="url(#clerkGradient)"/>
      <text x="75" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Clerk Auth</text>
      <text x="75" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#E0E0FF">JWT Sessions + Middleware</text>
    </g>
    
    <!-- API Routes -->
    <g transform="translate(360, 60)">
      <rect x="0" y="0" width="160" height="70" rx="8" fill="#FFFFFF" opacity="0.95"/>
      <text x="80" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">API Routes</text>
      <text x="80" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#6B7280">/api/videos</text>
      <text x="80" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#6B7280">/api/auth/youtube</text>
    </g>
    
    <!-- MongoDB -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="150" height="70" rx="8" fill="url(#databaseGradient)"/>
      <text x="75" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">MongoDB</text>
      <text x="75" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D4EDD8">Mongoose 9.1.3 + Indexes</text>
    </g>
    
    <!-- Cloudinary -->
    <g transform="translate(190, 150)">
      <rect x="0" y="0" width="150" height="70" rx="8" fill="url(#cloudinaryGradient)"/>
      <text x="75" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Cloudinary</text>
      <text x="75" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#FFE0E0">Video Upload + Storage</text>
    </g>
    
    <!-- YouTube OAuth -->
    <g transform="translate(360, 150)">
      <rect x="0" y="0" width="160" height="70" rx="8" fill="url(#youtubeGradient)"/>
      <text x="80" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">YouTube OAuth</text>
      <text x="80" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#FFD0D0">AES-256-GCM Encrypted</text>
    </g>
    
    <!-- Axios HTTP Client -->
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="500" height="60" rx="8" fill="#FFFFFF" opacity="0.9"/>
      <text x="250" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Axios HTTP Client</text>
      <text x="250" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#6B7280">Communicates with Python Agent Service via REST API</text>
    </g>
    
    <!-- Arrow to Python -->
    <path d="M 520 270 L 580 270 L 580 450 L 620 450" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrowhead-blue)" stroke-dasharray="5,5"/>
    <text x="555" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#3B82F6">REST API</text>
  </g>
  
  <!-- Arrow to Python Service -->
  <line x1="870" y1="260" x2="960" y2="260" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="915" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280">HTTP POST</text>
  
  <!-- Python Agent Service Box -->
  <g transform="translate(970, 100)">
    <!-- Main container -->
    <rect x="0" y="0" width="180" height="320" rx="16" fill="url(#pythonGradient)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="40" rx="16" fill="#3776AB"/>
    <rect x="0" y="20" width="180" height="20" fill="#3776AB"/>
    <text x="90" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Python Agent</text>
    <text x="90" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#E8E8E8">FastAPI + LangChain</text>
    
    <!-- Security Agent -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="150" height="55" rx="6" fill="#FFFFFF" opacity="0.95"/>
      <text x="75" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#111827">🛡️ Security Agent</text>
      <text x="75" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#6B7280">Gemini 2.5 Flash</text>
    </g>
    
    <!-- SEO Agent -->
    <g transform="translate(15, 130)">
      <rect x="0" y="0" width="150" height="55" rx="6" fill="#FFFFFF" opacity="0.95"/>
      <text x="75" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#111827">📝 SEO Agent</text>
      <text x="75" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#6B7280">Gemini 2.5 Pro</text>
    </g>
    
    <!-- Thumbnail Agent -->
    <g transform="translate(15, 200)">
      <rect x="0" y="0" width="150" height="55" rx="6" fill="#FFFFFF" opacity="0.95"/>
      <text x="75" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#111827">🖼️ Thumbnail Agent</text>
      <text x="75" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#6B7280">Gemini 2.5 Pro</text>
    </g>
    
    <!-- LangChain + Gemini -->
    <g transform="translate(15, 270)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#111827" opacity="0.9"/>
      <text x="75" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">LangChain + Google Gemini</text>
    </g>
  </g>
  
  <!-- Arrow back to Next.js -->
  <path d="M 970 450 L 910 450 L 910 270 L 870 270" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowhead-green)" stroke-dasharray="5,5"/>
  <text x="915" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#10B981">JSON Response</text>
  
  <!-- Deployment Info -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="1100" height="100" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="550" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Deployment Architecture</text>
    
    <!-- Vercel -->
    <g transform="translate(100, 50)">
      <rect x="0" y="0" width="200" height="60" rx="8" fill="#000000"/>
      <text x="100" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Vercel (Free Tier)</text>
      <text x="100" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#9CA3AF">Next.js App + API</text>
    </g>
    
    <!-- Railway -->
    <g transform="translate(350, 50)">
      <rect x="0" y="0" width="200" height="60" rx="8" fill="#4B5563"/>
      <text x="100" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Railway (Free Tier)</text>
      <text x="100" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#D1D5DB">Python Agent Service</text>
    </g>
    
    <!-- MongoDB Atlas -->
    <g transform="translate(600, 50)">
      <rect x="0" y="0" width="200" height="60" rx="8" fill="#47A248"/>
      <text x="100" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">MongoDB Atlas</text>
      <text x="100" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#D4EDD8">Cloud Database</text>
    </g>
    
    <!-- External Services -->
    <g transform="translate(850, 50)">
      <rect x="0" y="0" width="200" height="60" rx="8" fill="#6B7280"/>
      <text x="100" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">External Services</text>
      <text x="100" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#D1D5DB">Google Cloud, Cloudinary</text>
    </g>
  </g>
  
  <!-- Data Flow Legend -->
  <g transform="translate(50, 610)">
    <rect x="0" y="0" width="1100" height="140" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="550" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Data Flow</text>
    
    <!-- Step 1 -->
    <g transform="translate(50, 50)">
      <circle cx="20" cy="20" r="20" fill="#3B82F6"/>
      <text x="20" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
      <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">User uploads video via React UI</text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(50, 90)">
      <circle cx="20" cy="20" r="20" fill="#3B82F6"/>
      <text x="20" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
      <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Video stored in Cloudinary, metadata in MongoDB</text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(400, 50)">
      <circle cx="20" cy="20" r="20" fill="#3B82F6"/>
      <text x="20" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
      <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Next.js sends video to Python Agent</text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(400, 90)">
      <circle cx="20" cy="20" r="20" fill="#3B82F6"/>
      <text x="20" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
      <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">AI agents analyze &amp; generate SEO metadata</text>
    </g>
    
    <!-- Step 5 -->
    <g transform="translate(750, 50)">
      <circle cx="20" cy="20" r="20" fill="#10B981"/>
      <text x="20" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
      <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Results returned to Next.js</text>
    </g>
    
    <!-- Step 6 -->
    <g transform="translate(750, 90)">
      <circle cx="20" cy="20" r="20" fill="#10B981"/>
      <text x="20" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
      <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">User reviews &amp; publishes to YouTube</text>
    </g>
  </g>
  
  <!-- Key Features -->
  <g transform="translate(50, 770)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6B7280">Key Features:</text>
    <text x="100" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6B7280">Dual-Backend Architecture • Separation of Concerns • Independent Scalability • AES-256-GCM Token Encryption • Serverless-Optimized</text>
  </g>
</svg>
